name: Build SideStore iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SideStore IPA
        run: npm run build:ipa

      - name: Upload MoneyManager-SideStore.ipa Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoneyManager-SideStore-IPA
          path: MoneyManager-SideStore.ipa
          retention-days: 14
