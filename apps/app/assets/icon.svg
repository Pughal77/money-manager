<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sovereign Emerald Gradient -->
    <linearGradient id="mmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D734D"/>
      <stop offset="50%" stop-color="#085437"/>
      <stop offset="100%" stop-color="#043622"/>
    </linearGradient>

    <!-- Crisp White Pearl Gradient -->
    <linearGradient id="mmWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#E2F4EB"/>
    </linearGradient>

    <!-- Mint / White Rim -->
    <linearGradient id="mmRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="mmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022416" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022416" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#mmBgGrad)"/>

  <!-- Minted Coin Borders -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#mmRimGrad)" stroke-width="2.5"/>
  <rect x="50" y="50" width="412" height="412" rx="80" fill="none" stroke="url(#mmRimGrad)" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.4"/>

  <!-- Corner Mint Accents -->
  <circle cx="66" cy="66" r="3.5" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="446" cy="66" r="3.5" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="66" cy="446" r="3.5" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="446" cy="446" r="3.5" fill="#FFFFFF" fill-opacity="0.65"/>

  <!-- Formal Dual-Pillar Dollar Sign -->
  <g filter="url(#mmShadow)">
    <!-- Left Pillar -->
    <rect x="231" y="80" width="10" height="352" rx="1" fill="url(#mmWhiteGrad)"/>
    <rect x="226" y="80" width="20" height="6" rx="1" fill="url(#mmWhiteGrad)"/>
    <rect x="226" y="426" width="20" height="6" rx="1" fill="url(#mmWhiteGrad)"/>

    <!-- Right Pillar -->
    <rect x="271" y="80" width="10" height="352" rx="1" fill="url(#mmWhiteGrad)"/>
    <rect x="266" y="80" width="20" height="6" rx="1" fill="url(#mmWhiteGrad)"/>
    <rect x="266" y="426" width="20" height="6" rx="1" fill="url(#mmWhiteGrad)"/>

    <!-- Serif S Body -->
    <path d="M 175.42 299.93 L 190.46 299.93 L 198.15 336.66 C 202.93 342.25, 210.17 346.92, 219.86 350.68 C 229.54 354.44, 239.57 356.32, 249.93 356.32 C 282.63 356.32, 298.98 342.88, 298.98 315.99 C 298.98 307.55, 295.88 300.43, 289.67 294.63 C 283.46 288.82, 273.69 283.63, 260.36 279.07 C 240.76 272.58, 226.66 267.31, 218.06 263.27 C 209.45 259.22, 202.19 254.46, 196.26 248.99 C 190.34 243.52, 185.62 236.89, 182.09 229.08 C 178.56 221.28, 176.79 211.68, 176.79 200.29 C 176.79 180.12, 183.66 164.77, 197.39 154.24 C 211.11 143.70, 231.19 138.43, 257.62 138.43 C 276.77 138.43, 297.96 140.88, 321.20 145.77 L 321.20 200.29 L 305.98 200.29 L 298.29 168.85 C 286.68 160.41, 273.12 156.19, 257.62 156.19 C 243.61 156.19, 232.84 158.79, 225.32 163.97 C 217.80 169.16, 214.04 177.11, 214.04 187.82 C 214.04 195.44, 217.17 201.96, 223.43 207.38 C 229.70 212.80, 239.50 217.61, 252.84 221.82 C 278.93 230.37, 296.85 237.81, 306.59 244.13 C 316.33 250.45, 323.76 258.29, 328.89 267.63 C 334.01 276.96, 336.57 287.95, 336.57 300.60 C 336.57 349.25, 307.92 373.58, 250.62 373.58 C 237.52 373.58, 224.16 372.46, 210.54 370.24 C 196.93 368.02, 185.22 365.09, 175.42 361.44 Z" fill="url(#mmWhiteGrad)"/>
  </g>
</svg>